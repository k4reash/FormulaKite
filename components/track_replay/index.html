<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family:
          "Source Sans Pro",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        color: #fafafa;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden;
      }
      #top {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #map {
        min-width: 0;
        height: 420px;
        border-radius: 6px;
        background: #0e1117;
      }
      #panel {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 8px;
        font-size: 12px;
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-left-width: 3px;
        border-radius: 6px;
        padding: 6px 8px;
        background: rgba(255, 255, 255, 0.03);
      }
      .card .rows {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 12px;
      }
      .card h4 {
        margin: 0 0 4px 0;
        font-size: 13px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 6px;
        padding: 1px 0;
        color: #b8b8b8;
      }
      .row b {
        color: #fafafa;
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        white-space: nowrap;
      }
      .row.sel {
        color: #00cc96;
      }
      @media (max-width: 480px) {
        .card .rows {
          grid-template-columns: 1fr;
        }
      }
      #controls {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 4px 4px 4px;
        flex-wrap: wrap;
        font-size: 13px;
        color: #d0d0d0;
      }
      #controls button,
      #controls select {
        background: rgba(0, 204, 150, 0.12);
        border: 1px solid rgba(0, 204, 150, 0.5);
        color: #00cc96;
        border-radius: 4px;
        padding: 3px 10px;
        font-size: 13px;
        cursor: pointer;
        font-family: inherit;
      }
      #controls button:hover {
        background: rgba(0, 204, 150, 0.22);
      }
      #controls select option {
        background: #1a1d24;
        color: #fafafa;
      }
      #btn-play {
        min-width: 38px;
        font-size: 15px;
      }
      .spd.active,
      #btn-follow.active {
        background: rgba(0, 204, 150, 0.38);
        color: #fff;
      }
      #clock {
        margin-left: auto;
        font-variant-numeric: tabular-nums;
      }
      #clock b {
        color: #00cc96;
        font-size: 14px;
      }
      .legend {
        display: flex;
        gap: 12px;
        font-size: 11px;
        padding: 0 4px 2px 4px;
        flex-wrap: wrap;
      }
      .legend span {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .legend i {
        width: 10px;
        height: 3px;
        display: inline-block;
        border-radius: 2px;
      }
      svg {
        width: 100%;
        display: block;
        touch-action: none;
        cursor: pointer;
      }
      .grid-line {
        stroke: rgba(255, 255, 255, 0.08);
        stroke-width: 1;
      }
      .series-line {
        fill: none;
        stroke-width: 1.6;
        opacity: 0.95;
      }
      .axis-label {
        fill: rgba(255, 255, 255, 0.55);
        font-size: 10px;
      }
      .playhead {
        stroke: #fff;
        stroke-width: 1.5;
      }
      .playhead-knob {
        fill: #00cc96;
        stroke: #08110e;
        stroke-width: 1;
        cursor: ew-resize;
      }
      .boat-icon {
        background: none;
        border: none;
      }
      #map canvas {
        display: block;
        cursor: grab;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="top">
      <div id="panel"></div>
      <div id="map"><canvas id="map-canvas"></canvas></div>
    </div>
    <div id="controls">
      <select id="metric"></select>

      <button id="btn-play" type="button" title="Reproducir / pausar">▶</button>
      <button class="spd active" data-spd="1" type="button">1x</button>
      <button class="spd" data-spd="2" type="button">2x</button>
      <button class="spd" data-spd="4" type="button">4x</button>
      <button
        id="btn-follow"
        type="button"
        title="Centrar y encuadrar el mapa en los regatistas mientras se mueven"
      >
        🎯 Seguir
      </button>
      <span id="clock">⏱ <b id="lbl-clock">--:--:--</b></span>
    </div>
    <div class="legend" id="legend"></div>
    <svg id="chart" viewBox="0 0 1000 150" preserveAspectRatio="none"></svg>

    <div id="err" style="color: #ff6b6b; font-size: 12px; padding: 4px"></div>
    <script>
      function showErr(e) {
        document.getElementById("err").textContent =
          "Error: " + ((e && e.message) || e);
      }
      window.addEventListener("error", (ev) => showErr(ev.message));
    </script>
    <script>
      const NS = "http://www.w3.org/2000/svg";
      const VB_W = 1000,
        VB_H = 150,
        PAD_L = 6,
        PAD_R = 6,
        PAD_T = 8,
        PAD_B = 20;
      const plotW = VB_W - PAD_L - PAD_R,
        plotH = VB_H - PAD_T - PAD_B;

      let args = null,
        sig = null;

      let curMs = 0,
        playing = false,
        speed = 1,
        aheadS = 5,
        lastTs = null,
        dragging = false;
      let yMin = 0,
        yMax = 1,
        metric = null;

      const svg = document.getElementById("chart");
      const btnPlay = document.getElementById("btn-play");
      const lblClock = document.getElementById("lbl-clock");
      const metricSel = document.getElementById("metric");

      function fmtHMS(s) {
        s = ((s % 86400) + 86400) % 86400;
        return [
          Math.floor(s / 3600),
          Math.floor((s % 3600) / 60),
          Math.floor(s % 60),
        ]
          .map((v) => String(v).padStart(2, "0"))
          .join(":");
      }

      // índice i tal que t[i] <= x < t[i+1]
      function bsearch(arr, x) {
        let lo = 0,
          hi = arr.length - 1;
        while (lo < hi) {
          const mid = (lo + hi + 1) >> 1;
          if (arr[mid] <= x) lo = mid;
          else hi = mid - 1;
        }
        return lo;
      }

      function lerpAngle(a, b, f) {
        const d = ((b - a + 540) % 360) - 180;
        return (a + d * f + 360) % 360;
      }

      // posición en coordenadas de mundo interpolada entre muestras (ms acotado a la traza)
      function wposAt(r, ms) {
        const n = r.t.length;
        ms = Math.min(Math.max(ms, r.t[0]), r.t[n - 1]);
        const i = bsearch(r.t, ms);
        if (i >= n - 1) return [r.wx[n - 1], r.wy[n - 1]];
        const f = (ms - r.t[i]) / (r.t[i + 1] - r.t[i] || 1);
        return [
          r.wx[i] + (r.wx[i + 1] - r.wx[i]) * f,
          r.wy[i] + (r.wy[i + 1] - r.wy[i]) * f,
        ];
      }

      function posAt(r, ms) {
        const n = r.t.length;
        if (!n || ms < r.t[0] || ms > r.t[n - 1]) return null;
        const i = bsearch(r.t, ms);
        if (i >= n - 1)
          return {
            lat: r.lat[n - 1],
            lon: r.lon[n - 1],
            hdg: r.hdg ? r.hdg[n - 1] : 0,
          };
        const f = (ms - r.t[i]) / (r.t[i + 1] - r.t[i] || 1);
        return {
          lat: r.lat[i] + (r.lat[i + 1] - r.lat[i]) * f,
          lon: r.lon[i] + (r.lon[i + 1] - r.lon[i]) * f,
          hdg: r.hdg ? lerpAngle(r.hdg[i], r.hdg[i + 1], f) : 0,
        };
      }

      // valor de una métrica del regatista en curMs (null si no hay dato o está fuera de su traza)
      function metricAt(r, key) {
        const n = r.t.length;
        if (!r.metrics || !r.metrics[key] || !n) return null;
        if (curMs < r.t[0] || curMs > r.t[n - 1]) return null;
        return interpAt(r.metrics[key].v, r, bsearch(r.t, curMs), key);
      }

      // TWD media (circular) de los regatistas con dato en curMs
      function windAt() {
        let s = 0,
          c = 0,
          k = 0;
        args.racers.forEach((r) => {
          const v = metricAt(r, "TWD");
          if (v === null) return;
          s += Math.sin((v * Math.PI) / 180);
          c += Math.cos((v * Math.PI) / 180);
          k++;
        });
        if (!k) return null;
        return ((Math.atan2(s, c) * 180) / Math.PI + 360) % 360;
      }

      // ceñida (gana el más a barlovento) o popa (el más a sotavento), con histéresis
      let lastLeg = "up";
      function legMode() {
        let s = 0,
          k = 0;
        args.racers.forEach((r) => {
          const v = metricAt(r, "TWA");
          if (v === null) return;
          s += Math.cos((v * Math.PI) / 180);
          k++;
        });
        if (k) {
          const m = s / k;
          if (m > 0.2) lastLeg = "up";
          else if (m < -0.2) lastLeg = "down";
        }
        return lastLeg;
      }

      // ── Mapa propio en canvas (proyección Mercator + teselas opcionales) ─────────
      // Las líneas y el barco se dibujan siempre; las teselas son solo el fondo y, si
      // no cargan (sin red / bloqueadas), queda un fondo oscuro con cuadrícula.
      const cv = document.getElementById("map-canvas");
      const ctx = cv.getContext("2d");
      const TILE_URLS = [
        "https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}.png?key=cb1_47g1_1_e3de9d8bb58aa32a792ce32c",
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
      ];
      const tileCache = new Map();
      let view = { cx: 0.5, cy: 0.5, scale: 256 }; // scale = px por unidad de mundo [0,1]
      let cw = 600,
        ch = 420,
        dirty = true,
        tileSrc = 0,
        tileOk = 0,
        tileFail = 0,
        mapDrag = null;
      const MAX_SCALE = 256 * Math.pow(2, 19);

      const mx = (lon) => (lon + 180) / 360;
      const my = (lat) => {
        const s = Math.sin((lat * Math.PI) / 180);
        return 0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI);
      };

      function resizeCanvas() {
        const r = cv.parentElement.getBoundingClientRect();
        cw = Math.max(200, Math.round(r.width));
        ch = Math.round(r.height) || 420;
        const dpr = window.devicePixelRatio || 1;
        cv.width = cw * dpr;
        cv.height = ch * dpr;
        cv.style.width = cw + "px";
        cv.style.height = ch + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        dirty = true;
      }

      function boatPath(c, x, y, ang, color) {
        c.save();
        c.translate(x, y);
        c.rotate((ang * Math.PI) / 180);
        c.beginPath();
        c.moveTo(0, -11);
        c.lineTo(3.5, 8);
        c.lineTo(0, 5);
        c.lineTo(-3.5, 8);
        c.closePath();
        c.fillStyle = color;
        c.fill();
        c.lineWidth = 1.2;
        c.strokeStyle = "#fff";
        c.lineJoin = "round";
        c.stroke();
        c.restore();
      }

      function buildMap() {
        resizeCanvas();
        let x0 = 1,
          x1 = 0,
          y0 = 1,
          y1 = 0;
        args.racers.forEach((r) => {
          r.wx = r.lon.map(mx);
          r.wy = r.lat.map(my);
          r.wx.forEach((v) => {
            if (v < x0) x0 = v;
            if (v > x1) x1 = v;
          });
          r.wy.forEach((v) => {
            if (v < y0) y0 = v;
            if (v > y1) y1 = v;
          });
        });
        if (x1 < x0) {
          x0 = 0.4;
          x1 = 0.6;
          y0 = 0.4;
          y1 = 0.6;
        }
        const w = Math.max(x1 - x0, 1e-6),
          h = Math.max(y1 - y0, 1e-6);
        view = {
          cx: (x0 + x1) / 2,
          cy: (y0 + y1) / 2,
          scale: Math.min((cw - 60) / w, (ch - 60) / h),
        };
        view.scale = Math.min(view.scale, MAX_SCALE);
        dirty = true;
      }

      const sx = (wx) => (wx - view.cx) * view.scale + cw / 2;
      const sy = (wy) => (wy - view.cy) * view.scale + ch / 2;

      function getTile(z, x, y) {
        const key = `${tileSrc}/${z}/${x}/${y}`;
        let t = tileCache.get(key);
        if (!t) {
          t = new Image();
          t.onload = () => {
            t.ok = true;
            tileOk++;
            dirty = true;
          };
          t.onerror = () => {
            t.failed = true;
            tileFail++;
            if (!tileOk && tileFail >= 4 && tileSrc < TILE_URLS.length - 1) {
              tileSrc++;
              tileFail = 0;
            } // prueba otro proveedor
            dirty = true;
          };
          t.src = TILE_URLS[tileSrc]
            .replace("{s}", "abcd"[(x + y) % 4])
            .replace("{z}", z)
            .replace("{x}", x)
            .replace("{y}", y);
          tileCache.set(key, t);
        }
        return t;
      }

      function drawTiles() {
        const z = Math.max(
          0,
          Math.min(18, Math.round(Math.log2(view.scale / 256))),
        );
        const n = Math.pow(2, z),
          tsz = view.scale / n;
        const xa = Math.floor((view.cx - cw / 2 / view.scale) * n),
          xb = Math.floor((view.cx + cw / 2 / view.scale) * n);
        const ya = Math.floor((view.cy - ch / 2 / view.scale) * n),
          yb = Math.floor((view.cy + ch / 2 / view.scale) * n);
        if ((xb - xa + 1) * (yb - ya + 1) > 80) return;
        for (let x = xa; x <= xb; x++)
          for (let y = ya; y <= yb; y++) {
            if (y < 0 || y >= n) continue;
            const t = getTile(z, ((x % n) + n) % n, y);
            if (t.ok)
              ctx.drawImage(t, sx(x / n), sy(y / n), tsz + 0.5, tsz + 0.5);
          }
      }

      function strokeTrack(r, i0, i1, color, width, alpha) {
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.beginPath();
        for (let i = i0; i <= i1; i++) {
          const x = sx(r.wx[i]),
            y = sy(r.wy[i]);
          if (i === i0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      function drawTag(text, x, y, color) {
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        const w = ctx.measureText(text).width + 8;
        ctx.fillStyle = "rgba(14,17,23,0.8)";
        ctx.fillRect(x, y - 8, w, 16);
        ctx.fillStyle = color;
        ctx.fillText(text, x + 4, y);
        ctx.textBaseline = "alphabetic";
      }

      // líder = el más a barlovento en ceñida / más a sotavento en popa; distancia en el eje del viento
      function drawLadder(boats, twd) {
        const rad = (twd * Math.PI) / 180,
          ux = Math.sin(rad),
          uy = Math.cos(rad);
        const lat0 = boats[0].p.lat,
          lon0 = boats[0].p.lon,
          kx = Math.cos((lat0 * Math.PI) / 180) * 111320;
        boats.forEach((b) => {
          const e = (b.p.lon - lon0) * kx,
            nn = (b.p.lat - lat0) * 110540;
          b.up = e * ux + nn * uy; // metros avanzados hacia el viento
        });
        const sign = legMode() === "up" ? 1 : -1;
        const lead = boats.reduce((a, b) => (b.up * sign > a.up * sign ? b : a));
        // dirección de la línea en pantalla: perpendicular al viento (Mercator es conforme)
        const dx = Math.cos(rad),
          dy = Math.sin(rad);
        const line = (b, len, width, alpha, dash) => {
          ctx.globalAlpha = alpha;
          ctx.strokeStyle = b.r.color;
          ctx.lineWidth = width;
          ctx.setLineDash(dash);
          ctx.beginPath();
          ctx.moveTo(b.px - dx * len, b.py - dy * len);
          ctx.lineTo(b.px + dx * len, b.py + dy * len);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        };
        boats.forEach((b) => {
          if (b !== lead) line(b, 120, 1.2, 0.55, [5, 4]);
        });
        line(lead, cw + ch, 2, 0.9, []);
        boats.forEach((b) => {
          b.tag =
            b === lead
              ? `1º ${b.r.name}`
              : `−${Math.round(Math.abs(lead.up - b.up))} m`;
        });
      }

      // brújula: la flecha apunta hacia donde sopla (el viento viene de la TWD)
      function drawWind(twd) {
        const cx = 34,
          cy = 34,
          R = 22;
        ctx.globalAlpha = 1;
        ctx.fillStyle = "rgba(14,17,23,0.75)";
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, 2 * Math.PI);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.font = "9px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("N", cx, cy - R + 9);
        ctx.font = "bold 11px sans-serif";
        if (twd === null) {
          ctx.fillText("Sin viento", cx + 2, cy + R + 14);
          return;
        }
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(((twd + 180) * Math.PI) / 180);
        ctx.strokeStyle = "#7dd3fc";
        ctx.fillStyle = "#7dd3fc";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(0, R - 6);
        ctx.lineTo(0, -R + 10);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -R + 4);
        ctx.lineTo(5, -R + 12);
        ctx.lineTo(-5, -R + 12);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = "#7dd3fc";
        ctx.fillText(`TWD ${Math.round(twd)}°`, cx, cy + R + 14);
      }

      function drawMap() {
        ctx.fillStyle = "#0e1117";
        ctx.fillRect(0, 0, cw, ch);
        drawTiles();
        if (!tileOk) {
          // sin teselas: cuadrícula tenue
          ctx.strokeStyle = "rgba(255,255,255,0.05)";
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = (cw / 2) % 60; x < cw; x += 60) {
            ctx.moveTo(x, 0);
            ctx.lineTo(x, ch);
          }
          for (let y = (ch / 2) % 60; y < ch; y += 60) {
            ctx.moveTo(0, y);
            ctx.lineTo(cw, y);
          }
          ctx.stroke();
        }
        // 1) recorrido completo, muy tenue
        args.racers.forEach((r) => {
          if (r.wx && r.wx.length > 1)
            strokeTrack(r, 0, r.wx.length - 1, r.color, 2, 0.2);
        });
        // 2) traza por delante, opaca (los barcos se pintan después, encima de la línea de líder)
        const boats = [];
        args.racers.forEach((r) => {
          const p = r.wx && posAt(r, curMs);
          if (!p) return;
          // misma longitud (aheadS) por detrás y delante; los extremos se interpolan
          // para que la cola y la cabeza avancen de forma continua, no a saltos de muestra
          const tA = Math.max(curMs - aheadS * 1000, r.t[0]),
            tB = Math.min(curMs + aheadS * 1000, r.t[r.t.length - 1]);
          const iA = bsearch(r.t, tA),
            i0 = bsearch(r.t, curMs),
            iB = bsearch(r.t, tB);
          const px = sx(mx(p.lon)),
            py = sy(my(p.lat));
          // el ghost (rival ficticio de las maniobras) va translúcido y con traza discontinua
          ctx.globalAlpha = r.ghost ? 0.6 : 1;
          ctx.setLineDash(r.ghost ? [6, 5] : []);
          ctx.strokeStyle = r.color;
          ctx.lineWidth = 3.5;
          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          const a0 = wposAt(r, tA),
            b0 = wposAt(r, tB);
          ctx.beginPath();
          ctx.moveTo(sx(a0[0]), sy(a0[1]));
          for (let i = iA + 1; i <= i0; i++)
            ctx.lineTo(sx(r.wx[i]), sy(r.wy[i]));
          ctx.lineTo(px, py);
          for (let i = i0 + 1; i <= iB; i++)
            ctx.lineTo(sx(r.wx[i]), sy(r.wy[i]));
          ctx.lineTo(sx(b0[0]), sy(b0[1]));
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
          boats.push({ r, p, px, py });
        });
        // 3) línea de líder perpendicular al viento (como Sailmon) + barcos + viento
        const twd = windAt();
        if (twd !== null && boats.length >= 2) drawLadder(boats, twd);
        // etiqueta de cada barco: líder/distancia (si hay línea de líder) · SOG
        boats.forEach((b) => {
          const v = metricAt(b.r, SOG_KEY);
          const txt = [b.tag, v === null ? null : v.toFixed(1)]
            .filter(Boolean)
            .join(" · ");
          if (txt) drawTag(txt, b.px + 10, b.py - 12, b.r.color);
        });
        boats.forEach((b) => {
          ctx.globalAlpha = b.r.ghost ? 0.6 : 1;
          boatPath(ctx, b.px, b.py, b.p.hdg || 0, b.r.color);
        });
        ctx.globalAlpha = 1;
        drawWind(twd);
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.font = "10px sans-serif";
        ctx.textAlign = "right";
        ctx.fillText(
          tileOk
            ? "© OpenStreetMap © CARTO · rueda: zoom · arrastrar: mover"
            : "rueda: zoom · arrastrar: mover (sin mapa base)",
          cw - 6,
          ch - 6,
        );
      }

      function updateMap() {
        dirty = true;
      }
      // ── Seguimiento: encuadra a los regatistas activos y acompaña su movimiento ──
      const FOLLOW_MIN_M = 250; // encuadre mínimo (m) para no hacer zoom excesivo con un solo barco
      const btnFollow = document.getElementById("btn-follow");
      let follow = false;
      function setFollow(on) {
        follow = on;
        btnFollow.classList.toggle("active", on);
        dirty = true;
      }
      btnFollow.addEventListener("click", () => setFollow(!follow));

      function followStep() {
        let x0 = 1,
          x1 = 0,
          y0 = 1,
          y1 = 0,
          lat = 0;
        args.racers.forEach((r) => {
          const p = r.wx && posAt(r, curMs);
          if (!p) return;
          const x = mx(p.lon),
            y = my(p.lat);
          x0 = Math.min(x0, x);
          x1 = Math.max(x1, x);
          y0 = Math.min(y0, y);
          y1 = Math.max(y1, y);
          lat = p.lat;
        });
        if (x1 < x0) return;
        // metros → unidades de mundo Mercator en esta latitud
        const minW = FOLLOW_MIN_M / (40075016.686 * Math.cos((lat * Math.PI) / 180));
        const w = Math.max(x1 - x0, minW),
          h = Math.max(y1 - y0, minW);
        const tScale = Math.min((cw - 120) / w, (ch - 120) / h, MAX_SCALE),
          tcx = (x0 + x1) / 2,
          tcy = (y0 + y1) / 2;
        // aproximación suave (el zoom en escala logarítmica)
        const k = 0.15;
        const ls = Math.log(view.scale),
          nls = ls + (Math.log(tScale) - ls) * k;
        const ncx = view.cx + (tcx - view.cx) * k,
          ncy = view.cy + (tcy - view.cy) * k;
        if (
          Math.abs(nls - ls) > 1e-4 ||
          Math.abs(ncx - view.cx) * view.scale > 0.05 ||
          Math.abs(ncy - view.cy) * view.scale > 0.05
        ) {
          view.scale = Math.exp(nls);
          view.cx = ncx;
          view.cy = ncy;
          dirty = true;
        }
      }

      (function loop() {
        if (follow && args) followStep();
        if (dirty) {
          dirty = false;
          if (args) drawMap();
        }
        requestAnimationFrame(loop);
      })();

      cv.addEventListener("pointerdown", (e) => {
        mapDrag = { x: e.clientX, y: e.clientY, cx: view.cx, cy: view.cy };
        cv.setPointerCapture(e.pointerId);
      });
      cv.addEventListener("pointermove", (e) => {
        if (!mapDrag) return;
        if (follow && Math.hypot(e.clientX - mapDrag.x, e.clientY - mapDrag.y) > 3)
          setFollow(false); // mover a mano desactiva el seguimiento
        view.cx = mapDrag.cx - (e.clientX - mapDrag.x) / view.scale;
        view.cy = mapDrag.cy - (e.clientY - mapDrag.y) / view.scale;
        dirty = true;
      });
      cv.addEventListener("pointerup", () => {
        mapDrag = null;
      });
      cv.addEventListener("pointercancel", () => {
        mapDrag = null;
      });
      cv.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          if (follow) setFollow(false);
          const r = cv.getBoundingClientRect(),
            mxp = e.clientX - r.left,
            myp = e.clientY - r.top;
          const wx = (mxp - cw / 2) / view.scale + view.cx,
            wy = (myp - ch / 2) / view.scale + view.cy;
          view.scale = Math.min(
            Math.max(view.scale * Math.exp(-e.deltaY * 0.0015), 256),
            MAX_SCALE,
          );
          view.cx = wx - (mxp - cw / 2) / view.scale;
          view.cy = wy - (myp - ch / 2) / view.scale;
          dirty = true;
        },
        { passive: false },
      );
      window.addEventListener("resize", () => {
        resizeCanvas();
      });

      // ── Gráfica inferior ────────────────────────────────────────────────────────
      function xForMs(ms) {
        return PAD_L + (args.duration_ms ? ms / args.duration_ms : 0) * plotW;
      }
      function msForClientX(cx) {
        const rect = svg.getBoundingClientRect();
        const x = ((cx - rect.left) / rect.width) * VB_W;
        return Math.min(Math.max((x - PAD_L) / plotW, 0), 1) * args.duration_ms;
      }
      function el(tag, attrs) {
        const e = document.createElementNS(NS, tag);
        for (const k in attrs) e.setAttribute(k, attrs[k]);
        return e;
      }

      let playheadLine = null,
        playheadKnob = null;

      function buildChart() {
        svg.innerHTML = "";
        const span = yMax - yMin || 1;
        const yFor = (v) => PAD_T + plotH - ((v - yMin) / span) * plotH;
        for (let i = 0; i <= 4; i++) {
          const v = yMin + (span / 4) * i,
            y = yFor(v);
          svg.appendChild(
            el("line", {
              class: "grid-line",
              x1: PAD_L,
              x2: VB_W - PAD_R,
              y1: y,
              y2: y,
            }),
          );
          const t = el("text", { class: "axis-label", x: PAD_L + 2, y: y - 2 });
          t.textContent = Math.round(v);
          svg.appendChild(t);
        }
        const ticks = 6;
        for (let i = 0; i <= ticks; i++) {
          const ms = (args.duration_ms / ticks) * i;
          const t = el("text", {
            class: "axis-label",
            x: xForMs(ms),
            y: VB_H - 5,
            "text-anchor": i === 0 ? "start" : i === ticks ? "end" : "middle",
          });
          t.textContent = fmtHMS(args.start_clock_s + ms / 1000);
          svg.appendChild(t);
        }
        args.racers.forEach((r) => {
          const m = r.metrics[metric];
          if (!m) return;
          let d = "",
            pen = false;
          r.t.forEach((t, i) => {
            const v = m.v[i];
            if (v === null) {
              pen = false;
              return;
            } // hueco: levanta el lápiz
            d += `${pen ? "L" : "M"}${xForMs(t).toFixed(1)},${yFor(v).toFixed(1)}`;
            pen = true;
          });
          svg.appendChild(
            el("path", { class: "series-line", d, stroke: r.color }),
          );
        });
        playheadLine = el("line", {
          class: "playhead",
          y1: PAD_T,
          y2: PAD_T + plotH,
        });
        playheadKnob = el("circle", {
          class: "playhead-knob",
          r: 6,
          cy: PAD_T + plotH,
        });
        svg.appendChild(playheadLine);
        svg.appendChild(playheadKnob);
      }

      function applyMetric() {
        let lo = Infinity,
          hi = -Infinity;
        args.racers.forEach((r) =>
          (r.metrics[metric] ? r.metrics[metric].v : []).forEach((v) => {
            if (v !== null) {
              if (v < lo) lo = v;
              if (v > hi) hi = v;
            }
          }),
        );
        if (!isFinite(lo)) {
          lo = 0;
          hi = 1;
        }
        if (lo > 0) lo = 0; // la escala incluye el 0 salvo que todo sea negativo
        if (hi < 0) hi = 0;
        yMin = lo;
        yMax = hi;
        buildChart();
        updatePlayhead();
        highlightMetric();
      }
      metricSel.addEventListener("change", () => {
        metric = metricSel.value;
        applyMetric();
      });

      function updatePlayhead() {
        const x = xForMs(curMs);
        playheadLine.setAttribute("x1", x);
        playheadLine.setAttribute("x2", x);
        playheadKnob.setAttribute("cx", x);
        lblClock.textContent = fmtHMS(args.start_clock_s + curMs / 1000);
      }

      const panelEl = document.getElementById("panel");
      let cards = null;

      function buildPanel() {
        panelEl.innerHTML = "";
        cards = args.racers.map((r) => {
          const card = document.createElement("div");
          card.className = "card";
          card.style.borderLeftColor = r.color;
          const rows = {};
          let html = `<h4 style="color:${r.color}">${r.name}</h4><div class="rows">`;
          const keys = [...Object.keys(r.metrics)];
          if (r.fase) keys.push("Fase");
          keys.forEach((k) => {
            const unit = k === "Fase" ? "" : r.metrics[k].unit;
            html += `<div class="row" data-k="${k}"><span>${k}</span><b data-unit="${unit}">—</b></div>`;
          });
          html += `</div>`;
          card.innerHTML = html;
          card.querySelectorAll(".row").forEach((row) => {
            rows[row.dataset.k] = row;
          });
          panelEl.appendChild(card);
          return rows;
        });
        highlightMetric();
      }

      function highlightMetric() {
        if (!cards) return;
        cards.forEach((rows) =>
          Object.keys(rows).forEach((k) =>
            rows[k].classList.toggle("sel", k === metric),
          ),
        );
      }

      const CIRCULAR = new Set(["Rumbo (HDT)", "COG", "TWD"]);
      const SOG_KEY = "Velocidad (SOG)"; // etiqueta de REPLAY_METRICS en app.py
      // valor interpolado entre la muestra i y la i+1 (suaviza el refresco entre datos de 1 Hz)
      function interpAt(vals, r, i, key) {
        const a = vals[i],
          b = vals[i + 1];
        if (a === null || a === undefined) return null;
        if (b === null || b === undefined || i >= r.t.length - 1) return a;
        const f = Math.min(
          Math.max((curMs - r.t[i]) / (r.t[i + 1] - r.t[i] || 1), 0),
          1,
        );
        if (CIRCULAR.has(key)) {
          let d = ((b - a + 540) % 360) - 180;
          return (a + d * f + 360) % 360;
        }
        return a + (b - a) * f;
      }

      function updatePanel() {
        args.racers.forEach((r, k) => {
          const rows = cards[k],
            n = r.t.length;
          const inside = n && curMs >= r.t[0] && curMs <= r.t[n - 1];
          const i = inside ? bsearch(r.t, curMs) : -1;
          Object.keys(rows).forEach((key) => {
            const b = rows[key].querySelector("b");
            if (i < 0) {
              b.textContent = "—";
              return;
            }
            if (key === "Fase") {
              b.textContent = r.fase[i];
              return;
            }
            const v = interpAt(r.metrics[key].v, r, i, key);
            const txt =
              v === null
                ? "—"
                : `${v.toFixed(1)}${b.dataset.unit ? " " + b.dataset.unit : ""}`;
            if (b.textContent !== txt) b.textContent = txt;
          });
        });
      }

      function setTime(ms) {
        curMs = Math.min(Math.max(ms, 0), args.duration_ms);
        updatePlayhead();
        updateMap();
        updatePanel();
      }

      // ── Reproducción ────────────────────────────────────────────────────────────
      function setPlaying(p) {
        playing = p;
        btnPlay.textContent = p ? "⏸" : "▶";
        lastTs = null;
        if (p) {
          if (curMs >= args.duration_ms - 1) setTime(0);
          requestAnimationFrame(tick);
        }
      }
      function tick(ts) {
        if (!playing) return;
        if (lastTs !== null && !dragging) {
          setTime(curMs + (ts - lastTs) * speed);
          if (curMs >= args.duration_ms) {
            setPlaying(false);
            return;
          }
        }
        lastTs = ts;
        requestAnimationFrame(tick);
      }

      btnPlay.addEventListener("click", () => setPlaying(!playing));
      document.querySelectorAll(".spd").forEach((b) =>
        b.addEventListener("click", () => {
          speed = Number(b.dataset.spd);
          document
            .querySelectorAll(".spd")
            .forEach((x) => x.classList.toggle("active", x === b));
        }),
      );

      svg.addEventListener("pointerdown", (e) => {
        dragging = true;
        svg.setPointerCapture(e.pointerId);
        setTime(msForClientX(e.clientX));
      });
      svg.addEventListener("pointermove", (e) => {
        if (dragging) setTime(msForClientX(e.clientX));
      });
      svg.addEventListener("pointerup", () => {
        dragging = false;
      });
      svg.addEventListener("pointercancel", () => {
        dragging = false;
      });

      // ── Streamlit protocol ──────────────────────────────────────────────────────
      function setFrameHeight() {
        window.parent.postMessage(
          {
            isStreamlitMessage: true,
            type: "streamlit:setFrameHeight",
            height: document.documentElement.scrollHeight,
          },
          "*",
        );
      }

      async function onRender(event) {
        if (event.data.type !== "streamlit:render") return;
        try {
          render(event);
        } catch (e) {
          showErr(e);
        }
      }

      function render(event) {
        const newArgs = event.data.args;
        const newSig = JSON.stringify([
          newArgs.duration_ms,
          newArgs.racers.map((r) => [
            r.name,
            r.t.length,
            r.t[0],
            r.t[r.t.length - 1],
          ]),
        ]);
        if (newSig === sig) return; // mismo dato: no reiniciar reproducción
        sig = newSig;
        args = newArgs;
        const names = [];
        args.racers.forEach((r) =>
          Object.keys(r.metrics).forEach((k) => {
            if (!names.includes(k)) names.push(k);
          }),
        );
        const prev = metric;
        metricSel.innerHTML = names
          .map((n) => `<option>${n}</option>`)
          .join("");
        metric = names.includes(prev) ? prev : names[0];
        metricSel.value = metric;
        document.getElementById("legend").innerHTML = args.racers
          .map(
            (r) =>
              `<span><i style="background:${r.color}"></i>${r.name}</span>`,
          )
          .join("");
        setPlaying(false);
        buildMap();
        buildPanel();
        applyMetric();
        setTime(0);
        setTimeout(setFrameHeight, 0);
        setTimeout(() => {
          resizeCanvas();
          buildMap();
        }, 100);
      }

      window.addEventListener("message", onRender);
      window.parent.postMessage(
        {
          isStreamlitMessage: true,
          type: "streamlit:componentReady",
          apiVersion: 1,
        },
        "*",
      );
      window.addEventListener("resize", () => setTimeout(setFrameHeight, 0));
    </script>
  </body>
</html>
