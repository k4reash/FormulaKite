<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0; padding: 0; background: transparent;
    font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, sans-serif;
    color: #fafafa;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  #wrap { width: 100%; }
  #info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 13px;
    padding: 2px 4px 6px 4px;
    color: #d0d0d0;
  }
  #info b { color: #00CC96; font-size: 14px; }
  #controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 4px 6px 4px;
  }
  #controls button {
    background: rgba(0,204,150,0.12);
    border: 1px solid rgba(0,204,150,0.5);
    color: #00CC96;
    border-radius: 4px;
    padding: 3px 9px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  #controls button:hover { background: rgba(0,204,150,0.22); }
  #controls button:active { background: rgba(0,204,150,0.32); }
  #controls button:disabled { opacity: 0.4; cursor: default; background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.15); color: rgba(255,255,255,0.4); }
  #zoom-lbl { font-size: 11px; color: rgba(255,255,255,0.45); margin-left: auto; white-space: nowrap; }
  svg { width: 100%; display: block; touch-action: none; }
  .grid-line { stroke: rgba(255,255,255,0.08); stroke-width: 1; }
  .ref-line { stroke: rgba(255,255,255,0.18); stroke-width: 1; stroke-dasharray: 4 3; }
  .ref-label { fill: rgba(255,255,255,0.35); font-size: 10px; }
  .series-line { fill: none; stroke-width: 1.6; opacity: 0.95; }
  .axis-label { fill: rgba(255,255,255,0.55); font-size: 10px; }
  .band {
    fill: rgba(0, 204, 150, 0.16);
    stroke: #00CC96;
    stroke-width: 1.5;
    cursor: grab;
  }
  .band:active { cursor: grabbing; }
  .handle {
    fill: #00CC96;
    opacity: 0.9;
    cursor: ew-resize;
  }
  .handle:hover { opacity: 1; }
  .handle-grip {
    stroke: #08110e;
    stroke-width: 1;
  }
  .legend { display: flex; gap: 12px; font-size: 11px; padding: 0 4px 4px 4px; flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 10px; height: 3px; display: inline-block; border-radius: 2px; }
  .minimap-bg { cursor: pointer; }
  .minimap-view { cursor: grab; }
  .minimap-view:active { cursor: grabbing; }
</style>
</head>
<body>
<div id="wrap">
  <div id="info">
    <div>Tramo: <b id="lbl-range">--:--:-- → --:--:--</b></div>
    <div id="lbl-dur">Duración: 00:00:00</div>
  </div>
  <div id="controls">
    <button id="btn-zoom-sel" type="button" title="Acerca la vista al tramo seleccionado para ajustarlo con más precisión">🔍 Zoom al tramo</button>
    <button id="btn-zoom-reset" type="button" title="Vuelve a ver la sesión completa">↺ Ver todo</button>
    <span id="zoom-lbl" title="Rueda del ratón sobre el gráfico: zoom · Mayús+rueda o arrastra la franja inferior: desplazar"></span>
  </div>
  <div class="legend" id="legend"></div>
  <svg id="chart" viewBox="0 0 1000 240" preserveAspectRatio="none"></svg>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";
const VB_W = 1000, PAD_L = 6, PAD_R = 6, PAD_TOP = 10, PAD_BOTTOM = 22;
const MINIMAP_GAP = 10, MINIMAP_H = 20;
const MIN_GAP_MS = 3000;
const MIN_VIEW_MS = 4000;

let args = null;
let vbH = 240;
let plotW = VB_W - PAD_L - PAD_R;
let plotTop = PAD_TOP, plotH = 0;
let startMs = 0, endMs = 0;
let viewStart = 0, viewEnd = 0; // ventana visible actual (para el zoom)
let drag = null; // {mode:'move'|'left'|'right', startClientX, origStart, origEnd}
let minimapDrag = false;

const svg = document.getElementById("chart");
const lblRange = document.getElementById("lbl-range");
const lblDur = document.getElementById("lbl-dur");
const legendEl = document.getElementById("legend");
const zoomLbl = document.getElementById("zoom-lbl");
const btnZoomSel = document.getElementById("btn-zoom-sel");
const btnZoomReset = document.getElementById("btn-zoom-reset");

function fmtHMS(totalSeconds) {
  totalSeconds = ((totalSeconds % 86400) + 86400) % 86400;
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = Math.floor(totalSeconds % 60);
  return [h, m, s].map(v => String(v).padStart(2, "0")).join(":");
}

function fmtDur(ms) {
  return fmtHMS(Math.round(ms / 1000));
}

// mapea ms -> x usando la ventana de zoom actual (viewStart..viewEnd)
function xForMs(ms) {
  const span = (viewEnd - viewStart) || 1;
  const t = (ms - viewStart) / span;
  return PAD_L + t * plotW;
}
function msForX(x) {
  const span = (viewEnd - viewStart) || 1;
  const t = (x - PAD_L) / plotW;
  const ms = viewStart + t * span;
  return Math.min(Math.max(ms, 0), args.duration_ms);
}
// mapea ms -> x sobre la sesión COMPLETA (para el minimapa, independiente del zoom)
function xForMsFull(ms) {
  const t = args.duration_ms > 0 ? ms / args.duration_ms : 0;
  return PAD_L + t * plotW;
}
function msForXFull(x) {
  const t = (x - PAD_L) / plotW;
  return Math.min(Math.max(t, 0), 1) * args.duration_ms;
}
function svgPoint(clientX) {
  const rect = svg.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width * VB_W;
  return x;
}

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

let minimapSelRect = null, minimapViewRect = null;

function render() {
  svg.innerHTML = "";
  const totalVbH = vbH + MINIMAP_GAP + MINIMAP_H;
  svg.setAttribute("viewBox", `0 0 ${VB_W} ${totalVbH}`);
  plotTop = PAD_TOP;
  plotH = vbH - PAD_TOP - PAD_BOTTOM;

  // background
  svg.appendChild(el("rect", { x: 0, y: 0, width: VB_W, height: vbH, fill: "rgba(255,255,255,0.02)" }));

  // horizontal grid (4 lines)
  for (let i = 0; i <= 4; i++) {
    const y = plotTop + (plotH * i) / 4;
    svg.appendChild(el("line", { x1: PAD_L, x2: VB_W - PAD_R, y1: y, y2: y, class: "grid-line" }));
  }

  // speed range across all series
  let yMin = 0, yMax = 1;
  let hasData = false;
  (args.series || []).forEach(s => {
    s.points.forEach(p => {
      if (!hasData) { yMin = p[1]; yMax = p[1]; hasData = true; }
      if (p[1] < yMin) yMin = p[1];
      if (p[1] > yMax) yMax = p[1];
    });
  });
  if (!hasData) { yMin = 0; yMax = 30; }
  const pad = Math.max((yMax - yMin) * 0.08, 1);
  yMin -= pad; yMax += pad;

  function yForSpeed(v) {
    const t = (v - yMin) / (yMax - yMin || 1);
    return plotTop + plotH - t * plotH;
  }

  // reference threshold lines (kts)
  (args.ref_lines || []).forEach(v => {
    if (v >= yMin && v <= yMax) {
      const y = yForSpeed(v);
      svg.appendChild(el("line", { x1: PAD_L, x2: VB_W - PAD_R, y1: y, y2: y, class: "ref-line" }));
      const t = el("text", { x: VB_W - PAD_R - 2, y: y - 3, class: "ref-label", "text-anchor": "end" });
      t.textContent = v + " kt";
      svg.appendChild(t);
    }
  });

  // series lines (recortadas a puntos dentro/cerca de la ventana visible, para no
  // desperdiciar precisión de trazo fuera del área visible al hacer zoom)
  legendEl.innerHTML = "";
  (args.series || []).forEach(s => {
    if (!s.points.length) return;
    const d = s.points.map((p, i) => `${i === 0 ? "M" : "L"}${xForMs(p[0]).toFixed(1)},${yForSpeed(p[1]).toFixed(1)}`).join(" ");
    svg.appendChild(el("path", { d, class: "series-line", stroke: s.color }));
    const item = document.createElement("span");
    item.innerHTML = `<i style="background:${s.color}"></i>${s.name}`;
    legendEl.appendChild(item);
  });

  // time axis labels (start / end de la ventana visible actual)
  const startLbl = el("text", { x: PAD_L, y: vbH - 6, class: "axis-label" });
  startLbl.textContent = fmtHMS(args.start_clock_s + viewStart / 1000);
  svg.appendChild(startLbl);
  const endLbl = el("text", { x: VB_W - PAD_R, y: vbH - 6, class: "axis-label", "text-anchor": "end" });
  endLbl.textContent = fmtHMS(args.start_clock_s + viewEnd / 1000);
  svg.appendChild(endLbl);

  drawMinimap(vbH + MINIMAP_GAP);
  drawBand();
  updateZoomLabel();
}

let bandRect, handleL, handleR;

function drawBand() {
  const existing = svg.querySelectorAll(".band, .handle, .handle-grip");
  existing.forEach(n => n.remove());

  const x0 = xForMs(startMs), x1 = xForMs(endMs);
  bandRect = el("rect", {
    x: x0, y: plotTop, width: Math.max(x1 - x0, 0.1), height: plotH, class: "band",
  });
  svg.appendChild(bandRect);

  const hw = 9;
  handleL = el("rect", { x: x0 - hw / 2, y: plotTop, width: hw, height: plotH, class: "handle" });
  handleR = el("rect", { x: x1 - hw / 2, y: plotTop, width: hw, height: plotH, class: "handle" });
  svg.appendChild(handleL);
  svg.appendChild(handleR);

  [handleL, handleR].forEach((h, idx) => {
    const cx = idx === 0 ? x0 : x1;
    for (const dx of [-1.5, 1.5]) {
      svg.appendChild(el("line", {
        x1: cx + dx, x2: cx + dx, y1: plotTop + plotH * 0.3, y2: plotTop + plotH * 0.7, class: "handle-grip",
      }));
    }
  });

  bandRect.addEventListener("pointerdown", e => startDrag(e, "move"));
  handleL.addEventListener("pointerdown", e => startDrag(e, "left"));
  handleR.addEventListener("pointerdown", e => startDrag(e, "right"));

  updateMinimapSelection();
  updateLabels();
}

function drawMinimap(y) {
  const bg = el("rect", {
    x: PAD_L, y, width: plotW, height: MINIMAP_H,
    fill: "rgba(255,255,255,0.05)", stroke: "rgba(255,255,255,0.14)", "stroke-width": 1,
    rx: 3, class: "minimap-bg",
  });
  svg.appendChild(bg);

  minimapSelRect = el("rect", {
    x: 0, y: y + 4, width: 1, height: MINIMAP_H - 8,
    fill: "rgba(0,204,150,0.65)", class: "minimap-sel",
  });
  svg.appendChild(minimapSelRect);

  minimapViewRect = el("rect", {
    x: 0, y, width: 1, height: MINIMAP_H,
    fill: "rgba(255,255,255,0.16)", stroke: "#ffffff", "stroke-width": 1,
    class: "minimap-view",
  });
  svg.appendChild(minimapViewRect);

  bg.addEventListener("pointerdown", startMinimapDrag);
  minimapViewRect.addEventListener("pointerdown", startMinimapDrag);

  updateMinimapSelection();
  updateMinimapView();
}

function updateMinimapSelection() {
  if (!minimapSelRect) return;
  const sx0 = xForMsFull(startMs), sx1 = xForMsFull(endMs);
  minimapSelRect.setAttribute("x", sx0);
  minimapSelRect.setAttribute("width", Math.max(sx1 - sx0, 1));
}

function updateMinimapView() {
  if (!minimapViewRect) return;
  const vx0 = xForMsFull(viewStart), vx1 = xForMsFull(viewEnd);
  minimapViewRect.setAttribute("x", vx0);
  minimapViewRect.setAttribute("width", Math.max(vx1 - vx0, 2));
}

function updateLabels() {
  lblRange.textContent = `${fmtHMS(args.start_clock_s + startMs / 1000)} → ${fmtHMS(args.start_clock_s + endMs / 1000)}`;
  lblDur.textContent = "Duración: " + fmtDur(endMs - startMs);
}

function updateZoomLabel() {
  const factor = args.duration_ms / ((viewEnd - viewStart) || 1);
  const atFull = (viewEnd - viewStart) >= args.duration_ms - 1;
  zoomLbl.textContent = atFull ? "Sin zoom" : `Zoom: ${factor.toFixed(1)}×`;
  btnZoomReset.disabled = atFull;
}

function startDrag(e, mode) {
  e.preventDefault();
  e.stopPropagation();
  const x = svgPoint(e.clientX);
  drag = {
    mode,
    startX: x,
    origStart: startMs,
    origEnd: endMs,
    grabOffsetMs: mode === "move" ? msForX(x) - startMs : 0,
  };
  e.target.setPointerCapture(e.pointerId);
}

function onPointerMove(e) {
  if (minimapDrag) {
    panViewTo(msForXFull(svgPoint(e.clientX)));
    return;
  }
  if (!drag) return;
  const x = svgPoint(e.clientX);
  const ms = msForX(x);

  if (drag.mode === "left") {
    startMs = Math.min(Math.max(ms, 0), drag.origEnd - MIN_GAP_MS);
    startMs = Math.max(startMs, 0);
  } else if (drag.mode === "right") {
    endMs = Math.max(Math.min(ms, args.duration_ms), drag.origStart + MIN_GAP_MS);
    endMs = Math.min(endMs, args.duration_ms);
  } else if (drag.mode === "move") {
    const dur = drag.origEnd - drag.origStart;
    let newStart = ms - drag.grabOffsetMs;
    newStart = Math.min(Math.max(newStart, 0), args.duration_ms - dur);
    startMs = newStart;
    endMs = newStart + dur;
  }
  drawBand();
}

function onPointerUp(e) {
  if (minimapDrag) {
    minimapDrag = false;
    return;
  }
  if (!drag) return;
  drag = null;
  commitValue();
}

function commitValue() {
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setComponentValue",
    value: { start_ms: Math.round(startMs), end_ms: Math.round(endMs) },
  }, "*");
}

// ── Zoom / pan de la ventana visible ──────────────────────────────────────
function setView(newStart, newEnd) {
  if (newStart < 0) { newEnd -= newStart; newStart = 0; }
  if (newEnd > args.duration_ms) { newStart -= (newEnd - args.duration_ms); newEnd = args.duration_ms; }
  viewStart = Math.max(newStart, 0);
  viewEnd = Math.min(newEnd, args.duration_ms);
  render();
}

function zoomAt(anchorMs, factor) {
  const span = viewEnd - viewStart;
  let newSpan = Math.min(Math.max(span / factor, MIN_VIEW_MS), args.duration_ms);
  const ratio = span > 0 ? (anchorMs - viewStart) / span : 0.5;
  const newStart = anchorMs - ratio * newSpan;
  setView(newStart, newStart + newSpan);
}

function panViewTo(centerMs) {
  const span = viewEnd - viewStart;
  setView(centerMs - span / 2, centerMs + span / 2);
}

function startMinimapDrag(e) {
  e.preventDefault();
  e.stopPropagation();
  minimapDrag = true;
  e.target.setPointerCapture(e.pointerId);
  panViewTo(msForXFull(svgPoint(e.clientX)));
}

function onWheel(e) {
  e.preventDefault();
  const x = svgPoint(e.clientX);
  if (e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
    // desplazamiento horizontal (Mayús+rueda, o gesto horizontal de trackpad)
    const rect = svg.getBoundingClientRect();
    const scale = VB_W / rect.width;
    const dVb = (e.shiftKey ? e.deltaY : e.deltaX) * scale;
    const span = viewEnd - viewStart;
    const deltaMs = (dVb / plotW) * span;
    setView(viewStart + deltaMs, viewEnd + deltaMs);
  } else {
    const anchorMs = msForX(x);
    const factor = e.deltaY < 0 ? 1.25 : 1 / 1.25;
    zoomAt(anchorMs, factor);
  }
}

function zoomToSelection() {
  const sel = endMs - startMs;
  const pad = Math.max(sel * 0.25, MIN_VIEW_MS * 0.25);
  setView(startMs - pad, endMs + pad);
}

function resetZoom() {
  setView(0, args.duration_ms);
}

document.addEventListener("pointermove", onPointerMove);
document.addEventListener("pointerup", onPointerUp);
svg.addEventListener("wheel", onWheel, { passive: false });
btnZoomSel.addEventListener("click", zoomToSelection);
btnZoomReset.addEventListener("click", resetZoom);

function setFrameHeight() {
  const infoH = document.getElementById("info").offsetHeight;
  const controlsH = document.getElementById("controls").offsetHeight;
  const legendH = legendEl.offsetHeight;
  const totalVbH = vbH + MINIMAP_GAP + MINIMAP_H;
  const total = infoH + controlsH + legendH + (totalVbH * (svg.getBoundingClientRect().width / VB_W)) + 12;
  window.parent.postMessage({
    isStreamlitMessage: true,
    type: "streamlit:setFrameHeight",
    height: Math.ceil(total),
  }, "*");
}

function onRender(event) {
  if (event.data.type !== "streamlit:render") return;
  const newArgs = event.data.args;
  const isFirst = args === null;
  args = newArgs;
  vbH = args.height || 240;

  if (isFirst) {
    startMs = args.start_ms;
    endMs = args.end_ms;
    viewStart = 0;
    viewEnd = args.duration_ms;
  }

  render();
  setTimeout(setFrameHeight, 0);

  if (isFirst) {
    commitValue();
  }
}

window.addEventListener("message", onRender);
window.parent.postMessage({ isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 }, "*");
window.addEventListener("resize", () => setTimeout(setFrameHeight, 0));
</script>
</body>
</html>
